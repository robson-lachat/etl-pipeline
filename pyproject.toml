[project]
name = "etl-pipeline"
version = "0.1.0"
description = "Extract, Transform and Load (ETL) pipeline for UNIFAP student data"
authors = [
    {name = "robson-lachat",email = "robson.neves@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[tool.poetry]
packages = [{include = "etl_pipeline", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
run-etl = "etl_pipeline.main:run_pipeline"